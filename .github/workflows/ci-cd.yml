# =============================================
# CI/CD Pipeline - Mini SPA React
# =============================================
#
# Este pipeline se ejecuta automaticamente cuando:
# - Se hace push a la rama main
# - Se abre un Pull Request hacia main
#
# Pasos:
# 1. Instala dependencias
# 2. Ejecuta los tests
# 3. Hace build de produccion
# 4. Despliega a GitHub Pages (solo en push a main)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =============================================
  # JOB 1: Ejecutar Tests
  # =============================================
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: npm run test:run

  # =============================================
  # JOB 2: Build de produccion
  # =============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Build de produccion
        run: npm run build

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # =============================================
  # JOB 3: Deploy a GitHub Pages (solo en push a main)
  # =============================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar artefacto del build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
